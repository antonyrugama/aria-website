<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#09090B">
    <meta name="robots" content="noindex">
    <meta name="referrer" content="no-referrer">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <title>Página no encontrada | Page not found | Aria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        /* GitHub Pages serves this file for every missing path, at any depth: keep every URL root-absolute. */
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
        [hidden]{display:none!important}
        :root{
            --cyan:#00E5FF;
            --bg:#09090B;
            --card:#111113;
            --border:rgba(255,255,255,.06);
            --border-h:rgba(255,255,255,.12);
            --t1:#FAFAFA;
            --t2:#A1A1AA;
        }
        html{-webkit-font-smoothing:antialiased}
        body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:#D4D4D8;line-height:1.6;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 20px 40px}
        a{color:inherit;text-decoration:none}
        button{font-family:inherit;cursor:pointer;border:none}
        :focus-visible{outline:2px solid var(--cyan);outline-offset:3px}

        .top{width:100%;max-width:480px;display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
        .top img{height:44px;width:auto}
        .lang{display:flex;gap:4px;border:1px solid var(--border-h);border-radius:999px;padding:3px}
        .lang button{background:transparent;color:var(--t2);font-size:13px;font-weight:700;letter-spacing:.08em;padding:6px 14px;border-radius:999px;min-height:32px}
        .lang button[aria-pressed="true"]{background:var(--cyan);color:#000}

        main{width:100%;max-width:480px}
        .card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px 24px;text-align:center}
        .eyebrow{font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--cyan);margin-bottom:12px}
        h1{font-family:'Outfit',sans-serif;font-weight:800;font-size:26px;line-height:1.2;color:var(--t1);margin-bottom:22px}
        .code{font-family:'Outfit',sans-serif;font-weight:800;font-size:clamp(30px,10vw,52px);line-height:1.1;letter-spacing:.06em;color:var(--cyan);background:rgba(0,229,255,.08);border:1px solid rgba(0,229,255,.3);border-radius:14px;padding:18px 12px;overflow-wrap:anywhere;user-select:all;-webkit-user-select:all}
        .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;border-radius:14px;font-weight:700;font-size:15px;padding:14px 20px;transition:transform .2s,box-shadow .2s}
        .btn svg{flex:none}
        .btn-p{background:var(--cyan);color:#000;box-shadow:0 0 32px rgba(0,229,255,.22)}
        .btn-p:hover{transform:translateY(-2px);box-shadow:0 0 44px rgba(0,229,255,.38)}
        .btn-s{background:transparent;color:var(--t1);border:1px solid var(--border-h);font-weight:600}
        .btn-s:hover{border-color:var(--cyan)}
        .stack{display:flex;flex-direction:column;gap:12px}
        #copy{margin-top:14px}
        .status{min-height:22px;margin-top:8px;font-size:13px;color:var(--cyan)}
        .hint{font-size:13px;color:var(--t2);margin-top:12px}
        .actions{margin-top:8px}
        .steps{margin-top:22px;text-align:left;padding:22px 24px;background:var(--card);border:1px solid var(--border);border-radius:20px}
        .steps h2{font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--t2);margin-bottom:14px}
        .steps ol{list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:12px}
        .steps li{counter-increment:s;display:flex;gap:14px;align-items:flex-start;color:var(--t1);font-size:15px}
        .steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:rgba(0,229,255,.12);color:var(--cyan);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
        .steps li span{padding-top:2px}
        .nf{text-align:center;padding-top:12vh}
        .nf .big{font-family:'Outfit',sans-serif;font-weight:800;font-size:72px;color:var(--cyan);line-height:1}
        .nf p{margin:10px 0 0;color:var(--t2)}
        .nf .btn{margin:28px auto 0;max-width:280px}
        @media (min-width:700px){body{padding-top:40px}}
    </style>
</head>
<body>
    <div class="top">
        <a href="/" aria-label="Aria"><img src="/logo_con_tagline.png" alt="Aria"></a>
        <div class="lang" id="lang" role="group" aria-label="Idioma" hidden>
            <button type="button" data-lang="es" aria-pressed="true">ES</button>
            <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
    </div>

    <main>
        <section class="nf" id="not-found">
            <div class="big">404</div>
            <p>Página no encontrada.</p>
            <p>Page not found.</p>
            <a class="btn btn-p" href="/">runwitharia.com</a>
        </section>

        <section id="invite" hidden>
            <div class="card">
                <p class="eyebrow" id="eyebrow"></p>
                <h1 id="heading"></h1>
                <div class="code" id="code" translate="no"></div>
                <button class="btn btn-s" id="copy" type="button">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
                    <span id="copy-label"></span>
                </button>
                <p class="status" id="copy-status" role="status" aria-live="polite"></p>

                <div class="stack actions">
                    <a class="btn btn-p" id="open" href="/" hidden>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                        <span id="open-label"></span>
                    </a>
                    <p class="hint" id="open-hint" hidden></p>
                    <a class="btn btn-s" id="store-ios" href="https://apps.apple.com/us/app/run-with-aria/id6760048203">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
                        <span id="store-ios-label"></span>
                    </a>
                    <a class="btn btn-s" id="store-android" href="https://play.google.com/store/apps/details?id=com.runwitharia.mobile&amp;pcampaignid=web_share">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 20.5v-17c0-.83 1.01-1.3 1.67-.78l16 8.5c.58.31.58 1.17 0 1.48l-16 8.5C4.01 21.8 3 21.33 3 20.5z"/></svg>
                        <span id="store-android-label"></span>
                    </a>
                </div>
            </div>

            <div class="steps">
                <h2 id="steps-heading"></h2>
                <ol id="steps">
                    <li><span></span></li>
                    <li><span></span></li>
                    <li><span></span></li>
                </ol>
            </div>
        </section>
    </main>

    <script src="/invite-landing.js"></script>
</body>
</html>
