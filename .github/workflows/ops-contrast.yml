name: Ops v2 contrast

# Measures WCAG AA at every rendered text site on ops/shell-v2.html, and WCAG
# SC 1.4.11's 3:1 at every focus indicator a keyboard can reach there, in both
# themes and all four preview states.
#
# Why this is a browser check and not a stylesheet scan: the defect it exists
# for is a USAGE-SITE swap. `color: var(--cyan-ink)` becoming `color:
# var(--cyan)` leaves every token defined, every token holding its designed
# value, and every existing check green — and paints a pill at 3.03:1. The
# token is fine. The rule asking for it is not. Only the resolved pair of
# colours at the site answers that, and on this page the backdrop is a
# gradient under a translucent surface, so the resolved pair only exists in
# pixels: the check hides the glyphs, screenshots the page and samples the
# topmost paint at each run of text. That is the surface behind the glyphs
# only while nothing paints over them -- see NOT COVERED in ops/README.md.
#
# The focus sweep is a separate comparison rather than a fifth preview state.
# A ring is judged against the surfaces BESIDE it, and `outline-offset` decides
# which those are -- positive puts the ring outside the control, on whatever
# the control sits on, negative puts it on the control itself. So each control
# is photographed THREE times -- unfocused, focused, and focused again with
# the ring alone switched off -- rather than modelled from geometry. The ring
# is what the third differs from the second in; the surface it lands on is
# read from the third, so a control whose focus style also repaints its own
# surround (a glow standing down as the ring goes up) is measured rather than
# guessed at against stale pixels. Real Tab presses drive it:
# `:focus-visible` is a modality heuristic, and scripted focus alone matches it
# on nothing, which would make every ring on the page look absent.
#
# A FOURTH capture is taken before any of those three, and it is not a
# photograph of a state: it is a second shot of the SAME unfocused page, taken
# back to back with the first. Chrome does not hold text perfectly still
# between two identical captures -- removing a composited layer makes it
# re-rasterise glyphs -- so pixels that disagree between those two shots are
# excluded from the change mask BY NAME. That is a noise floor measured on the
# run rather than a tolerance chosen once and left to drift from its comment,
# and it matters which way round it is done: a tolerance on the size of the
# change would be blind to an indicator smaller than the noise, and worse, it
# would convert the FINDING "this control paints nothing on focus" into the
# EXCUSE "this is not an outline". See Stadiora/Aria#10778.
#
# Whose surface the ring lands on is asked of the DOM rather than of the
# pixels, because pixels cannot tell a surface from the content drawn on it.
# The ring band is hit-tested against the document, and a control with nowhere
# beside its ring that belongs to its own layout context is refused: it has no
# surface, and its worst neighbouring pixel is another control's. The log
# prints how many rows could not be fully hit-tested, because a sample that
# silently shrinks makes "every sampled point is foreign" cheap to satisfy.
# See Stadiora/Aria#10686.
#
# The tool proves itself before it judges anything (`--self-test`) and exits
# non-zero if that fails, so a run that cannot trust its own numbers reports
# nothing rather than passing. Sites it cannot judge are failures too, text
# and focus alike, and both sweeps assert a floor on how many sites they
# reached -- a guard silently judging zero is the worst false green available
# here, and it prints identically to a clean run without one.
#
# Note: this repo has no self-hosted runners registered, so it uses
# ubuntu-latest. The self-hosted runner requirement applies to Stadiora/Aria.
# ubuntu-latest ships google-chrome-stable, which is what ops-shell-v2.yml
# already drives over the DevTools Protocol on this same runner image.

on:
  pull_request:
    paths:
      - 'ops/**'
      - 'scripts/check-ops-contrast.mjs'
      - '.github/workflows/ops-contrast.yml'
  push:
    branches: [main]
    paths:
      - 'ops/**'
      - 'scripts/check-ops-contrast.mjs'
      - '.github/workflows/ops-contrast.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contrast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Node 22 or newer, because the check drives headless Chrome over the
      # DevTools Protocol through the global WebSocket rather than a package.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Fail here rather than deep inside the check if the image ever stops
      # shipping a browser. A contrast guard with no browser has to stop, not
      # skip: an exit 0 with nothing measured is the false green this whole
      # check exists to remove.
      - name: Confirm the runner has a browser
        run: |
          google-chrome --version || chromium --version
      # --verbose prints the per-pass counts. They are the thing to read in
      # this log: 203-206 text sites and 26 focus indicators in each of the
      # eight passes. A pass reporting zero has measured nothing and would
      # otherwise look exactly like a pass that found no defects.
      - name: Measure every text site against WCAG AA and every focus ring against 1.4.11
        run: node scripts/check-ops-contrast.mjs --verbose
